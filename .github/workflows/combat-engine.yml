name: BF6 Combat Engine
on:
  workflow_dispatch:
  push:
    branches: [main]
    # Only changes that can alter the exhaustive cache trigger the expensive
    # 62-weapon matrix automatically. UI/audit-only edits use quality-gates.yml.
    paths:
      - 'scripts/build-combat-cache.mjs'
      - 'scripts/merge-combat-cache.mjs'
      - 'scripts/auto-selection-policy.mjs'
      - 'scripts/cache-state-signature.mjs'
      - 'scripts/verified-source-sanitizer.mjs'
      - 'scripts/list-cache-weapons.mjs'
      - 'data/*-audit.json'
      - 'data/weapons.json'
      - 'data/attachments.json'
      - 'data/ammo.json'
      - 'data/ballistics.json'
permissions:
  contents: write
concurrency:
  group: bf6-data-pipeline
  cancel-in-progress: true

jobs:
  prepare:
    name: Preflight + weapon audits
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      upstream_sha: ${{ steps.upstream.outputs.sha }}
      weapon_matrix: ${{ steps.matrix.outputs.matrix }}
      weapon_count: ${{ steps.matrix.outputs.count }}
    steps:
      - name: Checkout Weapons Lab
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Checkout current simulator source
        uses: actions/checkout@v4
        with:
          repository: raymdl/BF6-Weapon-Analyzer
          ref: main
          path: .upstream/bf6-analyzer
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Lock upstream revision
        id: upstream
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(git -C .upstream/bf6-analyzer rev-parse HEAD)"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Upstream commit: $SHA"
          echo "Lab commit:      $(git rev-parse HEAD)"
      - name: Upstream compatibility preflight
        run: node scripts/preflight-upstream.mjs .upstream/bf6-analyzer
      - name: Build per-weapon cache matrix
        id: matrix
        shell: bash
        run: |
          set -euo pipefail
          node scripts/list-cache-weapons.mjs .upstream/bf6-analyzer > /tmp/weapon-matrix.json
          MATRIX="$(cat /tmp/weapon-matrix.json)"
          COUNT="$(node -e "const fs=require('fs'); const x=JSON.parse(fs.readFileSync('/tmp/weapon-matrix.json','utf8')); console.log(x.include.length)")"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "Per-weapon cache jobs: $COUNT"
      - name: Syntax preflight
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          node --check class-data.js
          node --check roster-data.js
          node --check sw.js
          for f in scripts/*.mjs; do node --check "$f"; done
      - name: Gate cache-state dedupe semantics
        run: |
          node scripts/audit-cache-state-dedupe.mjs
          node scripts/audit-cache-state-scale.mjs
          node scripts/audit-partial-assumptions.mjs
      - name: Gate freshness/update fail-closed behavior
        run: node scripts/audit-freshness.mjs
      - name: Gate final cache integration policy
        run: node scripts/audit-final-gate-policy.mjs
      - name: Gate Assault Rifle math
        run: node scripts/audit-assault.mjs .upstream/bf6-analyzer data data/assault-audit.json
      - name: Gate Carbine math
        run: node scripts/audit-carbine.mjs .upstream/bf6-analyzer data data/carbine-audit.json
      - name: Gate SMG math
        run: node scripts/audit-smg.mjs .upstream/bf6-analyzer data data/smg-audit.json
      - name: Gate LMG math
        run: node scripts/audit-lmg.mjs .upstream/bf6-analyzer data data/lmg-audit.json
      - name: Gate DMR math
        run: node scripts/audit-dmr.mjs .upstream/bf6-analyzer data data/dmr-audit.json
      - name: Gate Sniper Rifle math
        run: node scripts/audit-sniper.mjs .upstream/bf6-analyzer data data/sniper-audit.json
      - name: Gate Sidearm math
        run: node scripts/audit-sidearm.mjs .upstream/bf6-analyzer data data/sidearm-audit.json
      - name: Gate Shotgun math
        run: node scripts/audit-shotgun.mjs .upstream/bf6-analyzer data data/shotgun-audit.json
      - name: Gate exact-distance ballistic TTK
        run: node scripts/audit-ballistic-ttk.mjs
      - name: Gate global roster and audit wiring
        run: node scripts/audit-global.mjs
      - name: Gate laserbeam recoil/spread META wiring
        run: node scripts/audit-laserbeam-meta.mjs
      - name: Gate manual weapon builder
        run: node scripts/audit-manual-weapon.mjs
      - name: Gate range-aware optic selection
        run: node scripts/audit-range-optics.mjs
      - name: Gate attachment display-name integrity
        run: node scripts/audit-attachment-names.mjs --check
      - name: Gate control wiring (no dead controls)
        run: node scripts/audit-priority-wiring.mjs
      - name: Gate REDSEC armour model
        run: node scripts/audit-redsec-armor.mjs
      - name: Gate patch reconciliation
        run: node scripts/audit-patch-reconciliation.mjs
      - name: Preserve runtime audit diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-audits
          if-no-files-found: ignore
          retention-days: 7
          path: data/*-audit-runtime.json

  cache:
    name: Cache ${{ matrix.weapon_name }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix: ${{ fromJSON(needs.prepare.outputs.weapon_matrix) }}
    steps:
      - name: Checkout Weapons Lab
        uses: actions/checkout@v4
      - name: Checkout locked simulator source
        uses: actions/checkout@v4
        with:
          repository: raymdl/BF6-Weapon-Analyzer
          ref: ${{ needs.prepare.outputs.upstream_sha }}
          path: .upstream/bf6-analyzer
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore successful ${{ matrix.weapon_name }} shard
        id: weapon-cache
        uses: actions/cache@v4
        with:
          path: |
            partial-cache/${{ matrix.slug }}.json
            partial-audit/${{ matrix.slug }}.json
          key: ${{ runner.os }}-bf6-perweapon-v30-${{ needs.prepare.outputs.upstream_sha }}-${{ hashFiles('scripts/build-combat-cache.mjs', 'scripts/auto-selection-policy.mjs', 'scripts/cache-state-signature.mjs', 'scripts/verified-source-sanitizer.mjs', 'scripts/list-cache-weapons.mjs', 'data/*-audit.json') }}-${{ matrix.slug }}
      - name: Build ${{ matrix.weapon_name }} exhaustive cache shard
        if: steps.weapon-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p partial-cache partial-audit
          node scripts/build-combat-cache.mjs .upstream/bf6-analyzer data \
            --weapon "${{ matrix.weapon_id }}" \
            --cache "partial-cache/${{ matrix.slug }}.json" \
            --audit "partial-audit/${{ matrix.slug }}.json"
      - name: Verify ${{ matrix.weapon_name }} shard exists
        shell: bash
        run: |
          set -euo pipefail
          test -s "partial-cache/${{ matrix.slug }}.json"
          test -s "partial-audit/${{ matrix.slug }}.json"
      - name: Upload ${{ matrix.weapon_name }} cache shard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: combat-part-${{ matrix.slug }}
          if-no-files-found: warn
          retention-days: 1
          path: |
            partial-cache/${{ matrix.slug }}.json
            partial-audit/${{ matrix.slug }}.json

  finalize:
    name: Merge + validate + publish
    needs: [prepare, cache]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Weapons Lab
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Checkout locked simulator source
        uses: actions/checkout@v4
        with:
          repository: raymdl/BF6-Weapon-Analyzer
          ref: ${{ needs.prepare.outputs.upstream_sha }}
          path: .upstream/bf6-analyzer
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download per-weapon cache shards
        uses: actions/download-artifact@v4
        with:
          pattern: combat-part-*
          path: partial-download
          merge-multiple: true
      - name: Collect per-weapon cache files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p partial-cache
          find partial-download -type f -path '*/partial-cache/*.json' -print -exec cp {} partial-cache/ \;
          FOUND="$(find partial-cache -maxdepth 1 -name '*.json' | wc -l)"
          EXPECTED="${{ needs.prepare.outputs.weapon_count }}"
          echo "Collected $FOUND / $EXPECTED per-weapon cache shards"
          test "$FOUND" -eq "$EXPECTED"
      - name: Snapshot exact upstream data used by shards
        run: node scripts/sync-from-upstream.mjs .upstream/bf6-analyzer data
      - name: Merge exhaustive cache shards
        run: node scripts/merge-combat-cache.mjs .upstream/bf6-analyzer partial-cache data
      - name: Validate generated cache
        run: node scripts/validate-combat-cache.mjs data/combat-cache.json data/source-manifest.json
      - name: Gate global integration against generated cache
        run: node scripts/audit-global.mjs data/combat-cache.json
      - name: Regenerate attachment display-name audit from the new snapshot
        run: node scripts/audit-attachment-names.mjs
      - name: Gate attachment display-name integrity
        run: node scripts/audit-attachment-names.mjs --check
      - name: Restore runtime audit diagnostics
        if: always()
        uses: actions/download-artifact@v4
        with:
          name: runtime-audits
          path: data
        continue-on-error: true
      - name: Upload final diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bf6-combat-engine-diagnostics
          if-no-files-found: ignore
          retention-days: 7
          path: |
            data/*-audit-runtime.json
            data/combat-audit.json
            data/combat-cache.json
            data/source-manifest.json
            data/global-integration-diagnostics.json
      - name: Promote verified freshness state
        run: node scripts/promote-freshness.mjs
      # Promotion sets the verified version from the cache; reconciliation then
      # caps it at the last patch whose combat deltas are actually represented.
      - name: Reconcile patch deltas against the rebuilt dataset
        run: node scripts/reconcile-patches.mjs --write
      - name: Gate patch reconciliation
        run: node scripts/audit-patch-reconciliation.mjs
      - name: Commit atomic source + cache update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "bf6-combat-bot"
          git config user.email "actions@users.noreply.github.com"
          rm -f data/global-integration-diagnostics.json
          git add -A data/global-integration-diagnostics.json 2>/dev/null || true
          git add data/weapons.json data/attachments.json data/ammo.json data/ballistics.json data/source-manifest.json \
            data/combat-cache.json data/combat-audit.json data/*-audit-runtime.json \
            data/attachment-name-audit.json data/attachment-name-audit.csv data/freshness-status.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No source/cache changes to commit."
            exit 0
          fi
          git commit -m "data: atomic BF6 source + per-weapon combat cache rebuild [skip ci]"
          git push origin HEAD:main
