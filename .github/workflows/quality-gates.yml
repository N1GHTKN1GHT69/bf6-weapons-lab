name: BF6 Lightweight Quality Gates
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'app.js'
      - 'class-data.js'
      - 'roster-data.js'
      - 'sw.js'
      - 'index.html'
      - 'styles.css'
      - 'scripts/**'
      - 'data/redsec-model.json'
      - 'data/patch-delta-ledger.json'
      - 'data/freshness-status.json'
      - 'data/optimizer-legality-divergence.json'
      - 'data/source-verification.json'
      - 'data/current-patch-coverage.json'
      - 'attachment-legality.js'
      - '.github/workflows/**'
permissions:
  contents: read
concurrency:
  group: bf6-quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          node --check class-data.js
          node --check roster-data.js
          node --check sw.js
          for f in scripts/*.mjs; do node --check "$f"; done
      - name: Fast deterministic gates
        shell: bash
        run: |
          set -euo pipefail
          node scripts/audit-freshness.mjs
          node scripts/audit-global.mjs
          node scripts/audit-priority-wiring.mjs
          node scripts/audit-redsec-armor.mjs
          node scripts/audit-patch-reconciliation.mjs
          node scripts/audit-roster-sets.mjs
          node scripts/audit-attachment-names.mjs --check
          node scripts/audit-ballistic-ttk.mjs
          node scripts/audit-manual-weapon.mjs
          node scripts/audit-range-optics.mjs
          node scripts/audit-laserbeam-meta.mjs
          node scripts/validate-combat-cache.mjs data/combat-cache.json data/source-manifest.json
      - name: Engine-execution gates
        # These boot the real app.js through scripts/lab-harness.mjs and compare
        # actual production output against independent references, instead of
        # pattern-matching the source the way the gates above do.
        shell: bash
        run: |
          set -euo pipefail
          node scripts/audit-engine-crosscheck.mjs
          node scripts/audit-eligibility-consistency.mjs
          node scripts/audit-mode-isolation.mjs
          node scripts/audit-optimizer-exhaustive.mjs --full
          node scripts/audit-optimizer-legality.mjs
          node scripts/audit-cache-identity.mjs
          node scripts/audit-advanced-options.mjs
          node scripts/audit-current-patch-coverage.mjs
          node scripts/audit-source-data.mjs
          node scripts/audit-field-impact.mjs
          node scripts/audit-beam-sensitivity.mjs
          node scripts/audit-name-honesty.mjs
          node scripts/audit-meta-sweep.mjs
