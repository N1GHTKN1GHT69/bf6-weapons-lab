name: BF6 Lightweight Quality Gates
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'app.js'
      - 'class-data.js'
      - 'roster-data.js'
      - 'sw.js'
      - 'index.html'
      - 'styles.css'
      - 'scripts/**'
      - 'data/redsec-model.json'
      - 'data/patch-delta-ledger.json'
      - 'data/freshness-status.json'
      - '.github/workflows/**'
permissions:
  contents: read
concurrency:
  group: bf6-quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          node --check class-data.js
          node --check roster-data.js
          node --check sw.js
          for f in scripts/*.mjs; do node --check "$f"; done
      - name: Fast deterministic gates
        shell: bash
        run: |
          set -euo pipefail
          node scripts/audit-freshness.mjs
          node scripts/audit-global.mjs
          node scripts/audit-priority-wiring.mjs
          node scripts/audit-redsec-armor.mjs
          node scripts/audit-patch-reconciliation.mjs
          node scripts/audit-attachment-names.mjs --check
          node scripts/audit-ballistic-ttk.mjs
          node scripts/audit-manual-weapon.mjs
          node scripts/audit-range-optics.mjs
          node scripts/audit-laserbeam-meta.mjs
          node scripts/validate-combat-cache.mjs data/combat-cache.json data/source-manifest.json
