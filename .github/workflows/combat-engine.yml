name: BF6 Combat Engine
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'data/*-audit.json'
      - 'data/weapons.json'
      - 'data/attachments.json'
      - 'data/ammo.json'
      - 'data/ballistics.json'
      - 'data/combat-cache.json'
      - 'data/source-manifest.json'
      - 'roster-data.js'
      - 'class-data.js'
      - 'app.js'
      - '.github/workflows/combat-engine.yml'
  schedule:
    - cron: '23 */6 * * *'
permissions:
  contents: write
concurrency:
  group: bf6-data-pipeline
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - name: Checkout Weapons Lab
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Checkout current simulator source
        uses: actions/checkout@v4
        with:
          repository: raymdl/BF6-Weapon-Analyzer
          ref: main
          path: .upstream/bf6-analyzer
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Record upstream revision
        run: |
          echo "Upstream commit: $(git -C .upstream/bf6-analyzer rev-parse HEAD)"
          echo "Lab commit:      $(git rev-parse HEAD)"
      - name: Upstream compatibility preflight
        run: node scripts/preflight-upstream.mjs .upstream/bf6-analyzer
      - name: Syntax preflight
        run: |
          set -euo pipefail
          node --check app.js
          node --check class-data.js
          node --check roster-data.js
          node --check sw.js
          for f in scripts/*.mjs; do node --check "$f"; done
      - name: Gate Assault Rifle math against audited values
        run: node scripts/audit-assault.mjs .upstream/bf6-analyzer data data/assault-audit.json
      - name: Gate Carbine math against audited values
        run: node scripts/audit-carbine.mjs .upstream/bf6-analyzer data data/carbine-audit.json
      - name: Gate SMG math against audited values
        run: node scripts/audit-smg.mjs .upstream/bf6-analyzer data data/smg-audit.json
      - name: Gate LMG math against audited values
        run: node scripts/audit-lmg.mjs .upstream/bf6-analyzer data data/lmg-audit.json
      - name: Gate DMR math against audited values
        run: node scripts/audit-dmr.mjs .upstream/bf6-analyzer data data/dmr-audit.json
      - name: Gate Sniper Rifle math against audited values
        run: node scripts/audit-sniper.mjs .upstream/bf6-analyzer data data/sniper-audit.json
      - name: Gate Sidearm math against audited values
        run: node scripts/audit-sidearm.mjs .upstream/bf6-analyzer data data/sidearm-audit.json
      - name: Gate Shotgun math against audited values
        run: node scripts/audit-shotgun.mjs .upstream/bf6-analyzer data data/shotgun-audit.json
      - name: Gate exact-distance ballistic TTK
        run: node scripts/audit-ballistic-ttk.mjs
      - name: Gate global roster and audit wiring
        run: node scripts/audit-global.mjs
      - name: Gate laserbeam recoil/spread META wiring
        run: node scripts/audit-laserbeam-meta.mjs
      - name: Gate manual weapon / range-lethality builder
        run: node scripts/audit-manual-weapon.mjs
      - name: Gate range-aware optic selection
        run: node scripts/audit-range-optics.mjs
      - name: Snapshot exact upstream data used by this run
        run: node scripts/sync-from-upstream.mjs .upstream/bf6-analyzer data
      - name: Run exhaustive combat audit
        run: node scripts/build-combat-cache.mjs .upstream/bf6-analyzer data
      - name: Validate generated cache
        run: node scripts/validate-combat-cache.mjs data/combat-cache.json data/source-manifest.json
      - name: Gate global integration against generated cache
        run: node scripts/audit-global.mjs data/combat-cache.json
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bf6-combat-engine-diagnostics
          if-no-files-found: ignore
          retention-days: 7
          path: |
            data/*-audit-runtime.json
            data/combat-audit.json
            data/combat-cache.json
            data/source-manifest.json
      - name: Commit atomic source + cache update
        run: |
          set -euo pipefail
          git config user.name "bf6-combat-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/weapons.json data/attachments.json data/ammo.json data/ballistics.json data/source-manifest.json \
            data/combat-cache.json data/combat-audit.json data/*-audit-runtime.json
          if git diff --cached --quiet; then
            echo "No source/cache changes to commit."
            exit 0
          fi
          git commit -m "data: atomic BF6 source + combat cache rebuild [skip ci]"
          git push origin HEAD:main
