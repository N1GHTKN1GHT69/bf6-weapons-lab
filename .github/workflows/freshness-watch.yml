name: BF6 Freshness Watch
on:
  workflow_dispatch:
  schedule:
    - cron: '7 * * * *'
permissions:
  contents: write
  actions: write
concurrency:
  group: bf6-freshness-watch
  cancel-in-progress: true

jobs:
  detect:
    name: Detect official/upstream changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      needs_rebuild: ${{ steps.freshness.outputs.needs_rebuild }}
      status_changed: ${{ steps.freshness.outputs.status_changed }}
      official_version: ${{ steps.freshness.outputs.official_version }}
    steps:
      - name: Checkout Weapons Lab
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve current analyzer revision
        id: upstream
        shell: bash
        run: |
          set -uo pipefail
          SHA="$(git ls-remote https://github.com/raymdl/BF6-Weapon-Analyzer.git refs/heads/main 2>/dev/null | awk '{print $1}' || true)"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          if [ -z "$SHA" ]; then echo "Analyzer SHA unavailable; EA freshness check will still run fail-closed."; fi
      - name: Check EA version + analyzer freshness
        id: freshness
        env:
          UPSTREAM_SHA: ${{ steps.upstream.outputs.sha }}
          BF6_REBUILD_RETRY_HOURS: '6'
        run: node scripts/check-freshness.mjs --write
      # Sym is the upstream PUBLISHER of the numbers this project ingests, and
      # their BF6 data stops at 1.3.3.0. A 1.4.x publication would resolve the
      # outstanding high-impact recoil/spread values from a published source, so
      # it is worth knowing immediately. continue-on-error: an unreachable third
      # party is not a defect in this repository, and the script exits non-zero
      # only on the GOOD news case (newer data found).
      - name: Watch Sym.gg for a newer BF6 dataset
        id: symwatch
        continue-on-error: true
        run: node scripts/watch-sym-source.mjs
      - name: Flag that Sym published newer BF6 data
        if: steps.symwatch.outcome == 'failure'
        run: |
          echo "::warning title=Sym published newer BF6 data::Re-capture the patch-notes page into data/sources/ and re-run scripts/audit-source-reconciliation.mjs"
      # Patch-delta reconciliation is deliberately NOT part of the hourly no-change
      # path: it only runs when EA published something new or the article changed.
      - name: Reconcile patch deltas (only on an EA change)
        if: steps.freshness.outputs.official_changed == 'true' || steps.freshness.outputs.article_revision_changed == 'true'
        run: node scripts/reconcile-patches.mjs --write
      - name: Commit freshness status only when it changed
        if: steps.freshness.outputs.status_changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "bf6-freshness-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/freshness-status.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "status: BF6 freshness check [skip ci]"
          # Main can move while this tiny watcher is running. Rebase the single
          # status commit rather than failing or force-pushing over real work.
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Dispatch combat rebuild only when source changed
        if: steps.freshness.outputs.needs_rebuild == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run combat-engine.yml --ref main
          echo "Dispatched BF6 Combat Engine for the new analyzer revision."

